<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professions – Mannenkeuken</title>
<link rel="icon" href="img/icon-128.png?v=__V__" type="image/png" sizes="128x128">
<link rel="icon" href="img/favicon-32.png?v=__V__" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=__V__">
<link rel="stylesheet" href="css/style.css?v=__V__">
<script>const whTooltips = { colorLinks: false, iconizeLinks: false, renameLinks: false };</script>
<script src="https://wow.zamimg.com/js/tooltips.js" async></script>
</head>
<body>
<main>
  <div>
    <h1>Professions</h1>
    <p class="muted">Who can craft what – guild-found, so we make everything ourselves (Mains and Alts)</p>
  </div>
  <div class="grid" id="cards"><p class="muted">Loading…</p></div>
</main>
<script type="module">
import { renderHeader } from './js/layout.js?v=__V__';
import { loadMembers, esc } from './js/sheet.js?v=__V__';
import { professionLabel } from './js/proficons.js?v=__V__';
renderHeader();

const MAX = 300;
const SECONDARY = ['Cooking', 'First Aid', 'Fishing'];
loadMembers().then((members) => {
  const byProf = {};
  for (const m of members.filter((x) => x.status !== 'Gestopt')) {
    for (const [p, s] of [[m.prof1, m.skill1], [m.prof2, m.skill2], ['Cooking', m.cooking], ['First Aid', m.firstAid], ['Fishing', m.fishing]]) {
      if (!p || (SECONDARY.includes(p) && (s === '' || s == null))) continue;
      (byProf[p] ??= []).push({ name: m.character || m.player, player: m.player, skill: Number(s) || 0 });
    }
  }
  const names = [...Object.keys(byProf).filter((p) => !SECONDARY.includes(p)).sort(), ...SECONDARY.filter((p) => byProf[p])];
  document.getElementById('cards').innerHTML = names.map((p) => `
    <section class="box">
      <div><h2>${professionLabel(p, { size: 28 })}</h2><p class="muted" style="font-size:13px;margin-top:2px">${new Set(byProf[p].map((c) => c.player)).size} player${new Set(byProf[p].map((c) => c.player)).size === 1 ? '' : 's'}</p></div>
      ${byProf[p].sort((a, b) => b.skill - a.skill).map((c) => `
        <div><div style="display:flex;justify-content:space-between;font-size:14px"><span class="who-name"><span>${esc(c.name)}</span>${c.player && c.player !== c.name ? `<span class="who-sub">${esc(c.player)}</span>` : ''}</span><span class="muted">${c.skill} / ${MAX}</span></div>
        <div class="bar" aria-hidden="true"><div style="width:${Math.min(100, (c.skill / MAX) * 100)}%"></div></div></div>`).join('')}
    </section>`).join('') || '<p class="muted">No professions in the sheet yet.</p>';
}).catch(() => {
  document.getElementById('cards').innerHTML = '<p class="muted">Could not read the sheet.</p>';
});
</script>
</body>
</html>
