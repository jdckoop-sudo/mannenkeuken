<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade Market – Mannenkeuken</title>
<link rel="stylesheet" href="css/style.css?v=__V__">
<script>const whTooltips = { colorLinks: true, iconizeLinks: true, renameLinks: false, iconSize: 'small' };</script>
<script src="https://wow.zamimg.com/js/tooltips.js" async></script>
</head>
<body>
<main>
  <div>
    <h1>Trade Market</h1>
    <p class="muted">Offer or request items within the guild – no prices, we share. Log in with Discord to post.</p>
  </div>
  <div class="row">
    <form id="new" class="box" style="flex: 1 1 300px">
      <h2 id="form-title">New listing</h2>
      <p id="form-msg" class="muted"></p>
      <fieldset><legend>Type</legend>
        <label><input type="radio" name="kind" value="offer" checked> Offer</label>
        <label><input type="radio" name="kind" value="request"> Request</label>
      </fieldset>
      <label for="item-input">Item</label>
      <div><input id="item-input" name="item" required maxlength="80" placeholder="Start typing, e.g. linen"><p id="item-hint" class="muted" style="font-size:13px;margin:6px 0 0"></p></div>
      <label>Quantity<input name="quantity" type="number" min="1" value="1"></label>
      <label>Note<textarea name="note" rows="3" maxlength="300"></textarea></label>
      <div class="row"><button class="btn btn-primary" id="submit-btn" type="submit">Post listing</button><button class="btn" id="cancel-edit" type="button" hidden>Cancel</button></div>
    </form>
    <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <label>Show<select id="filter"><option value="">All</option><option value="offer">Offers</option><option value="request">Requests</option><option value="mine">My listings</option></select></label>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Item</th><th>Type</th><th>Qty</th><th>Posted by</th><th>Date</th><th><span class="muted">Actions</span></th></tr></thead>
          <tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>
</main>
<script type="module">
import { renderHeader } from './js/layout.js?v=__V__';
import { supabase, displayName, isGuildMember } from './js/supabase.js?v=__V__';
import { esc } from './js/sheet.js?v=__V__';
import { attachItemSearch, loadItems, qualityColor, qualityName, wowheadUrl, refreshTooltips } from './js/itemsearch.js?v=__V__';

const user = await renderHeader();
const form = document.getElementById('new');
const msg = document.getElementById('form-msg');
let listings = [];
let pickedItem = null;
let editingId = null;
let itemsById = new Map();
const hint = document.getElementById('item-hint');
const search = attachItemSearch(document.getElementById('item-input'), (it) => {
  pickedItem = it;
  if (it) {
    hint.innerHTML = `${qualityName(it.quality)}${it.ilvl ? ` · item level ${it.ilvl}` : ''} · <a href="${wowheadUrl(it.id)}" target="_blank" rel="noopener">${esc(it.name)}</a> <span style="font-size:12px">(hover for stats)</span>`;
    refreshTooltips();
  } else hint.textContent = 'Not in the list? You can still post it as typed (hidden items appear once someone finds them).';
});
loadItems().then((items) => { itemsById = new Map(items.map((i) => [i.id, i])); draw(); });

if (!supabase) { msg.textContent = 'Market not connected yet.'; form.querySelector('button').disabled = true; }
else if (!user) { msg.textContent = 'Log in with Discord to post.'; form.querySelector('button').disabled = true; }
else if (!(await isGuildMember())) { msg.textContent = 'Only members of the Mannenkeuken Discord can post.'; form.querySelector('button').disabled = true; }

async function load() {
  if (!supabase) { document.getElementById('rows').innerHTML = '<tr><td colspan="7">Not connected yet.</td></tr>'; return; }
  const { data } = await supabase.from('listings').select('*').eq('status', 'open').order('created_at', { ascending: false });
  listings = data ?? [];
  draw();
}

function draw() {
  const f = document.getElementById('filter').value;
  const list = listings.filter((l) => !f || (f === 'mine' ? l.user_id === user?.id : l.kind === f));
  document.getElementById('rows').innerHTML = list.map((l) => {
    const mine = l.user_id === user?.id;
    return `<tr class="${mine ? 'mine' : ''}">
      <td>${l.item_id ? `<a href="${wowheadUrl(l.item_id)}" target="_blank" rel="noopener" style="font-weight:600;${itemsById.get(l.item_id) ? `color:${qualityColor(itemsById.get(l.item_id).quality)}` : ''}">${esc(l.item)}</a>` : esc(l.item)}${l.note ? `<br><span class="muted">${esc(l.note)}</span>` : ''}</td>
      <td>${l.kind === 'offer' ? 'Offer' : 'Request'}</td><td>${esc(l.quantity)}</td>
      <td>${mine ? 'You' : esc(l.author_name)}</td><td>${new Date(l.created_at).toLocaleDateString()}</td>
      <td>${mine ? `<button class="link-btn" data-edit="${l.id}">Edit</button> · <button class="link-btn" data-done="${l.id}" data-name="${esc(l.item)}">Mark as done</button> · <button class="link-btn" data-del="${l.id}" data-name="${esc(l.item)}">Delete</button>` : ''}</td></tr>`;
  }).join('') || '<tr><td colspan="7">No listings.</td></tr>';
  refreshTooltips();
}

document.getElementById('filter').addEventListener('input', draw);
function startEdit(l) {
  editingId = l.id;
  form.kind.value = l.kind;
  document.getElementById('item-input').value = l.item;
  form.quantity.value = l.quantity;
  form.note.value = l.note ?? '';
  pickedItem = l.item_id ? itemsById.get(l.item_id) ?? null : null;
  hint.textContent = '';
  document.getElementById('form-title').textContent = 'Edit listing';
  document.getElementById('submit-btn').textContent = 'Save changes';
  document.getElementById('cancel-edit').hidden = false;
  msg.textContent = '';
  form.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function stopEdit() {
  editingId = null;
  form.reset(); pickedItem = null; hint.textContent = ''; search.reset();
  document.getElementById('form-title').textContent = 'New listing';
  document.getElementById('submit-btn').textContent = 'Post listing';
  document.getElementById('cancel-edit').hidden = true;
}
document.getElementById('cancel-edit').addEventListener('click', stopEdit);
document.getElementById('rows').addEventListener('click', async (e) => {
  const { edit, done, del, name } = e.target.dataset;
  if (edit) { startEdit(listings.find((l) => l.id === edit)); return; }
  if (done) {
    if (!confirm(`Are you sure you want to mark "${name}" as done? It will disappear from the market.`)) return;
    await supabase.from('listings').update({ status: 'done' }).eq('id', done);
    if (editingId === done) stopEdit();
    load();
  } else if (del) {
    if (!confirm(`Are you sure you want to delete "${name}"? This can't be undone.`)) return;
    await supabase.from('listings').delete().eq('id', del);
    if (editingId === del) stopEdit();
    load();
  }
});
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const d = new FormData(form);
  const fields = {
    kind: d.get('kind'), item: d.get('item'), item_id: pickedItem && pickedItem.name === d.get('item') ? pickedItem.id : null,
    quantity: Number(d.get('quantity')) || 1, note: d.get('note'),
  };
  const { error } = editingId
    ? await supabase.from('listings').update(fields).eq('id', editingId)
    : await supabase.from('listings').insert({ ...fields, author_name: displayName(user) });
  msg.textContent = error ? `Could not save: ${error.message}` : editingId ? 'Saved!' : 'Posted!';
  if (!error) { stopEdit(); load(); }
});
load();
</script>
</body>
</html>
