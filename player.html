<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player – Mannenkeuken</title>
<link rel="icon" href="img/icon-128.png?v=__V__" type="image/png" sizes="128x128">
<link rel="icon" href="img/favicon-32.png?v=__V__" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=__V__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=__V__">
</head>
<body>
<main>
  <div>
    <a href="roster.html">← Guild</a>
    <h1 id="title">Player</h1>
    <p class="muted" id="sub"></p>
  </div>
  <section class="grid" id="stats" aria-label="Stats"></section>
  <h2>Characters</h2>
  <div class="grid player-chars" id="chars"><p class="muted">Loading…</p></div>
  <section class="box" id="game-stats-box" aria-label="Activity in the game" hidden>
    <h2>Activity in the game <span class="muted" style="font-size:14px;font-weight:400">(all characters from level 10)</span></h2>
    <div class="grid glance" id="game-stats"></div>
    <p class="muted" style="font-size:13px;margin:0">Updates after the player logs out.</p>
  </section>
  <section class="box" aria-label="Activity">
    <h2>Activity on the dashboard <span class="muted" style="font-size:14px;font-weight:400">(since WoW: Forever launch)</span></h2>
    <div class="stat-list" id="activity"><span class="muted">Loading…</span></div>
  </section>
</main>
<script type="module">
import { renderHeader } from './js/layout.js?v=__V__';
import { LAUNCH } from './js/releases.js?v=__V__';
import { supabase } from './js/supabase.js?v=__V__';
import { esc } from './js/sheet.js?v=__V__';
import { loadCharacters, loadBlizzard, gameTotals, gameStatTiles, statsFor, characterUrl, playerForUser, statusLabel } from './js/players.js?v=__V__';
import { characterFrame } from './js/charpicture.js?v=__V__';

const user = await renderHeader();
const name = new URLSearchParams(location.search).get('name');
const { characters, players } = await loadCharacters();
const target = name || playerForUser(user);
if (!target) {
  document.getElementById('title').textContent = 'Player not found';
  document.getElementById('chars').innerHTML = '<p class="muted">Pick a player on the <a href="roster.html">Roster</a>.</p>';
} else {
  const p = players.find((x) => x.player_name.toLowerCase() === target.toLowerCase());
  const chars = characters.filter((c) => (c.player || '').toLowerCase() === target.toLowerCase())
    .sort((a, b) => (a.kind === 'Main' ? -1 : 1) - (b.kind === 'Main' ? -1 : 1) || (b.level ?? 0) - (a.level ?? 0));
  document.title = `${target} – Mannenkeuken`;
  document.getElementById('title').textContent = target;
  // Player colour from css/style.css (--player-<name>); unknown players keep the normal heading colour.
  document.getElementById('title').style.color = `var(--player-${target.toLowerCase().replace(/[^a-z0-9]/g, '')}, inherit)`;
  document.getElementById('sub').textContent = p?.discord_name ? `Discord: ${p.discord_name}` : 'Discord name not linked yet';

  const liveChars = chars.filter((c) => c.status !== 'Gestopt');
  const s = statsFor(liveChars);
  const tile = (label, value, sub) => `<div class="box stat"><span class="muted">${label}</span><strong${typeof value === 'string' && !/^[#\d–]/.test(value) ? ' class="stat-text"' : ''}>${esc(value ?? '–')}</strong>${sub ? `<span class="stat-sub">${esc(sub)}</span>` : ''}</div>`;
  document.getElementById('stats').innerHTML = tile('Characters', s.characters)
    + tile('Highest character level', s.highestLevel) + tile('Total profession skill', s.totalSkill || '–')
    + tile('Best profession', s.bestProfession ? s.bestProfession.name : '–', s.bestProfession ? `Skill ${s.bestProfession.skill} / 300` : '');

  document.getElementById('chars').innerHTML = chars.map((c) => `
    <a class="box player-char" href="${characterUrl(c.name)}" style="text-decoration:none">
      <div class="player-char-text">
        <span class="badge">${esc(statusLabel(c.status))}</span>
        <strong style="font-size:18px">${esc(c.name)}</strong>
        <span class="muted">${esc([c.race, c.class, c.role].filter(Boolean).join(' · ') || '–')}</span>
        <span>Level <strong>${esc(c.level ?? '–')}</strong></span>
        ${c.profs.length ? `<span class="muted" style="font-size:14px">${c.profs.map((x) => `${esc(x.name)} ${esc(x.skill ?? '–')}`).join(' · ')}</span>` : ''}
      </div>
    </a>`).join('') || '<p class="muted">No characters yet.</p>';

  const blizzard = await loadBlizzard();
  // The picture from the game next to the name and level (the class icon as long as the game has none)
  document.querySelectorAll('#chars .player-char').forEach((card, i) => card.append(characterFrame(blizzard?.characters?.[chars[i].name.toLowerCase()], chars[i].name, chars[i].class, { small: true })));

  // Activity in the game (Blizzard API). Hidden until the update has collected numbers for anyone; a player below level 10 then sees dashes.
  if (gameTotals(characters, blizzard).known) {
    document.getElementById('game-stats').innerHTML = gameStatTiles(gameTotals(liveChars, blizzard));
    document.getElementById('game-stats-box').hidden = false;
  }

  // Activity (Supabase): by this player's logins (browsers) and name
  if (supabase) {
    const { data: logins } = await supabase.from('members').select('user_id').eq('player_name', name);
    const ids = [...new Set((logins ?? []).map((m) => m.user_id))];
    const names = [name, p?.discord_name].filter(Boolean); // deposits/addons are stored by name
    const count = async (q) => (await q).count ?? 0;
    const head = { count: 'exact', head: true };
    // Everything before the WoW: Forever launch was testing, so only count from LAUNCH.
    const since = (q) => q.gte('created_at', LAUNCH);
    const [signups, listings, deposits, tips, addons] = await Promise.all([
      ids.length ? count(since(supabase.from('signups').select('*', head).in('user_id', ids).eq('answer', 'yes'))) : 0,
      ids.length ? count(since(supabase.from('listings').select('*', head).in('user_id', ids))) : 0,
      count(since(supabase.from('bank_items').select('*', head).in('deposited_by', names))),
      ids.length ? count(since(supabase.from('tips').select('*', head).in('user_id', ids))) : 0,
      count(since(supabase.from('addons').select('*', head).in('author_name', names))),
    ]);
    document.getElementById('activity').innerHTML = [['Event sign-ups', signups], ['Trade listings', listings], ['Bank deposits', deposits], ['Tips shared', tips], ['Addons added', addons]]
      .map(([k, v]) => `<div><span>${k}</span><strong>${v}</strong></div>`).join('');
  } else document.getElementById('activity').innerHTML = '<span class="muted">Not connected yet.</span>';
}
</script>
</body>
</html>
