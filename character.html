<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character – Mannenkeuken</title>
<link rel="icon" href="img/icon-128.png?v=__V__" type="image/png" sizes="128x128">
<link rel="icon" href="img/favicon-32.png?v=__V__" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=__V__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=__V__">
<script>const whTooltips = { colorLinks: false, iconizeLinks: true, renameLinks: false, iconSize: 'small' };</script>
<script src="https://wow.zamimg.com/js/tooltips.js" async></script>
</head>
<body>
<main>
  <div>
    <a id="back" href="roster.html">← Guild</a>
    <h1 id="title">Character</h1>
    <p class="muted" id="sub"></p>
  </div>
  <div class="row">
    <section class="box" id="equipment-box" style="flex: 1 1 560px; max-width: 680px" hidden>
      <h2>Equipment</h2>
      <div id="equipment"></div>
    </section>
    <section class="box" style="flex: 1 1 340px">
      <h2>Details</h2>
      <div class="stat-list" id="details"></div>
    </section>
  </div>
  <section class="grid" id="stats" aria-label="Stats"></section>
  <section class="box" id="game-stats-box" aria-label="Activity in the game" hidden>
    <h2>Activity in the game</h2>
    <div class="grid trio" id="game-stats"></div>
    <p class="muted" style="font-size:13px;margin:0">Counted by the game and ranked against the other characters of the guild. Updates after the player logs out.</p>
  </section>
  <section class="box">
    <h2>Professions</h2>
    <div id="profs" style="display:flex;flex-direction:column;gap:10px"><p class="muted">Loading…</p></div>
  </section>
</main>
<script type="module">
import { renderHeader } from './js/layout.js?v=__V__';
import { esc } from './js/sheet.js?v=__V__';
import { professionLabel } from './js/proficons.js?v=__V__';
import { loadCharacters, loadBlizzard, playerUrl, statusLabel } from './js/players.js?v=__V__';
import { characterDoll } from './js/charpicture.js?v=__V__';
import { refreshTooltips } from './js/itemsearch.js?v=__V__';

await renderHeader();
const name = new URLSearchParams(location.search).get('name') || '';
const { characters } = await loadCharacters();
const c = characters.find((x) => x.name.toLowerCase() === name.toLowerCase());
if (!c) {
  document.getElementById('title').textContent = 'Character not found';
  document.getElementById('profs').innerHTML = '<p class="muted">Pick a character on the <a href="roster.html">Roster</a>.</p>';
} else {
  document.title = `${c.name} – Mannenkeuken`;
  document.getElementById('title').textContent = c.name;
  document.getElementById('sub').innerHTML = `${esc(statusLabel(c.status))} of ${c.player ? `<a href="${playerUrl(c.player)}">${esc(c.player)}</a>` : 'unknown player'}`;
  if (c.player) { const b = document.getElementById('back'); b.href = playerUrl(c.player); b.textContent = `← ${c.player}`; }

  // Rank within the guild (characters with a known level)
  const ranked = characters.filter((x) => x.level > 0 && x.status !== 'Gestopt').sort((a, b) => b.level - a.level);
  const rank = c.level > 0 ? ranked.findIndex((x) => x === c) + 1 : null;
  const skills = c.profs.filter((p) => p.skill !== null);
  const tile = (label, value, sub) => `<div class="box stat"><span class="muted">${label}</span><strong${typeof value === 'string' && !/^[#\d–]/.test(value) ? ' class="stat-text"' : ''}>${esc(value ?? '–')}</strong>${sub ? `<span class="stat-sub">${esc(sub)}</span>` : ''}</div>`;
  document.getElementById('stats').innerHTML = tile('Level', c.level) + tile('Level rank in the guild', rank ? `#${rank} of ${ranked.length}` : '–')
    + tile('Professions', c.profs.length || '–') + tile('Total profession skill', skills.reduce((a, p) => a + p.skill, 0) || '–');

  document.getElementById('profs').innerHTML = c.profs.map((p) => {
    // best in the guild for this profession?
    const best = Math.max(...characters.flatMap((x) => x.profs.filter((q) => q.name === p.name && q.skill !== null).map((q) => q.skill)), 0);
    return `<div><div style="display:flex;justify-content:space-between;font-size:14px"><span>${professionLabel(p.name, { size: 20 })}${p.skill && p.skill === best ? ' <span class="badge">Guild best</span>' : ''}</span><span class="muted">${esc(p.skill ?? '–')} / 300</span></div>
      <div class="bar" aria-hidden="true"><div style="width:${Math.min(100, ((p.skill ?? 0) / 300) * 100)}%"></div></div></div>`;
  }).join('') || '<p class="muted">No professions yet: they appear from level 10.</p>';

  // Last login and the game's own details, when the update has fetched this character
  const blizzard = await loadBlizzard();
  const bz = blizzard?.characters?.[c.name.toLowerCase()];
  const whenTime = (iso) => (iso ? new Date(iso).toLocaleString('en-GB', { timeZone: 'Europe/Amsterdam', hourCycle: 'h23', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : null);
  // Last login and Last updated (the last time the game data was fetched) come from the API; for a character the API does not know, the date it was last changed here is left.
  const apiOk = bz?.status === 'ok';
  // The picture from the game with the items around it, once the game knows this character
  if (apiOk) {
    document.getElementById('equipment').append(characterDoll(bz, c.name, c.class));
    document.getElementById('equipment-box').hidden = false;
    refreshTooltips();
  }
  // Activity in the game (Blizzard API): this character's counters, each ranked against the other guild characters that have numbers
  if (apiOk && bz.stats) {
    const stat = (x) => blizzard?.characters?.[x.name.toLowerCase()]?.stats;
    const pool = characters.filter((x) => x.status !== 'Gestopt' && stat(x));
    const metrics = [
      ['Quests completed', (s) => s.quests, 'Most in the guild'],
      ['Kills', (s) => s.kills, 'Most in the guild'],
      ['Deaths', (s) => s.deaths, 'Most in the guild: the Hall of Shame'],
      ['Fish caught', (s) => s.fish, 'Most in the guild'],
      ['Kills per death', (s) => (s.deaths > 0 ? s.kills / s.deaths : null), 'Best in the guild'],
      ['Quests per level', (s, x) => (x.level > 0 ? s.quests / x.level : null), 'Most in the guild'],
    ];
    const show = (v) => v.toLocaleString('en-GB', { maximumFractionDigits: 1 });
    document.getElementById('game-stats').innerHTML = metrics.map(([label, f, top]) => {
      const mine = f(bz.stats, c);
      if (mine === null) return tile(label, '–', label === 'Kills per death' ? 'No deaths yet' : '');
      const all = pool.map((x) => f(stat(x), x)).filter((v) => v !== null);
      const rank = 1 + all.filter((v) => v > mine).length;
      const sub = label === 'Deaths' && mine === 0 ? 'No deaths yet' : all.length < 2 ? '' : rank === 1 ? top : label === 'Deaths' ? `#${rank} most deaths of ${all.length}` : `#${rank} of ${all.length} in the guild`;
      return tile(label, show(mine), sub);
    }).join('');
    document.getElementById('game-stats-box').hidden = false;
  }
  // Under level 10 the guild roster still gives faction and guild (status "guild"), but no last login.
  const apiBasics = apiOk || bz?.status === 'guild';
  document.getElementById('details').innerHTML = [['Race', c.race], ['Class', c.class], ['Role', c.role], ['Faction', apiBasics ? bz.faction : null], ['Guild', apiBasics ? bz.guild : null], ['Status', statusLabel(c.status)], ['Key recipes', c.recipes], ['Notes', c.notes],
    ['Last login', apiOk ? whenTime(bz.lastLogin) : null], ['Last updated', apiBasics ? whenTime(blizzard?.updated ?? bz.fetched) : c.updated]]
    .filter(([, v]) => v).map(([k, v]) => `<div><span>${k}</span><strong>${esc(v)}</strong></div>`).join('');
}
</script>
</body>
</html>
