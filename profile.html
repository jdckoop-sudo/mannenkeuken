<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My profile – Mannenkeuken</title>
<link rel="stylesheet" href="css/style.css?v=__V__">
</head>
<body>
<main>
  <div>
    <h1>My profile</h1>
    <p class="muted">Save your main character once. It is used when you sign up for events.</p>
  </div>
  <form id="profile" class="box" style="max-width: 480px">
    <h2>Main character</h2>
    <p id="form-msg" class="muted"></p>
    <label>Character name<input name="character_name" maxlength="40" placeholder="e.g. Grommash"></label>
    <label>Race<select name="race"></select></label>
    <label>Class<select name="class"></select></label>
    <label>Role<select name="role"></select></label>
    <div class="row">
      <button class="btn btn-primary" type="submit">Save profile</button>
      <button class="btn" id="clear" type="button">Clear</button>
    </div>
  </form>
</main>
<script type="module">
import { renderHeader } from './js/layout.js?v=__V__';
import { supabase, getProfile } from './js/supabase.js?v=__V__';
import { esc } from './js/sheet.js?v=__V__';
import { RACES, classesForRace, rolesForClass } from './js/wowdata.js?v=__V__';

const user = await renderHeader();
const form = document.getElementById('profile');
const msg = document.getElementById('form-msg');

// Race -> class -> role: each dropdown only offers what the previous choice allows.
const options = (list, placeholder) => [`<option value="">${placeholder}</option>`, ...list.map((x) => `<option>${esc(x)}</option>`)].join('');
form.race.innerHTML = '<option value="">–</option>' + Object.entries(RACES).map(([faction, races]) =>
  `<optgroup label="${faction}">${Object.keys(races).map((r) => `<option>${esc(r)}</option>`).join('')}</optgroup>`).join('');
function fillClasses() {
  const classes = classesForRace(form.race.value);
  const keep = classes.includes(form.class.value) ? form.class.value : '';
  form.class.innerHTML = options(classes, form.race.value ? '–' : 'Pick a race first');
  form.class.value = keep;
  form.class.disabled = !form.race.value;
  fillRoles();
}
function fillRoles() {
  const roles = rolesForClass(form.class.value);
  const keep = roles.includes(form.role.value) ? form.role.value : '';
  form.role.innerHTML = options(roles, form.class.value ? '–' : 'Pick a class first');
  form.role.value = keep;
  form.role.disabled = !form.class.value;
}
form.race.addEventListener('change', fillClasses);
form.class.addEventListener('change', fillRoles);
fillClasses();

if (!supabase) { msg.textContent = 'Not connected yet.'; form.querySelectorAll('button').forEach((b) => { b.disabled = true; }); }
else if (!user) { msg.textContent = 'Log in with Discord to edit your profile.'; form.querySelectorAll('button').forEach((b) => { b.disabled = true; }); }
else {
  const p = await getProfile(user);
  if (p) {
    form.character_name.value = p.character_name ?? '';
    form.race.value = p.race ?? '';
    fillClasses();
    form.class.value = p.class ?? '';
    fillRoles();
    form.role.value = p.role ?? '';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const d = new FormData(form);
  const { error } = await supabase.from('profiles').upsert({
    user_id: user.id,
    character_name: d.get('character_name').trim() || null,
    race: d.get('race') || null,
    class: d.get('class') || null,
    role: d.get('role') || null,
    updated_at: new Date().toISOString(),
  }, { onConflict: 'user_id' });
  msg.textContent = error ? `Could not save: ${error.message}` : 'Saved!';
});

document.getElementById('clear').addEventListener('click', async () => {
  if (!confirm('Are you sure you want to clear your saved character?')) return;
  const { error } = await supabase.from('profiles').delete().eq('user_id', user.id);
  if (!error) { form.reset(); fillClasses(); }
  msg.textContent = error ? `Could not clear: ${error.message}` : 'Cleared.';
});
</script>
</body>
</html>
