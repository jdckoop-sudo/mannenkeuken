<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My profile – Mannenkeuken</title>
<link rel="stylesheet" href="css/style.css?v=__V__">
</head>
<body>
<main>
  <div>
    <h1>My profile</h1>
    <p class="muted">Save your main character once. It is used when you sign up for events.</p>
  </div>
  <form id="profile" class="box" style="max-width: 480px">
    <h2>Main character</h2>
    <p id="form-msg" class="muted"></p>
    <label>Character name<input name="character_name" maxlength="40" placeholder="e.g. Grommash"></label>
    <label>Class
      <select name="class">
        <option value="">–</option>
        <option>Druid</option><option>Hunter</option><option>Mage</option><option>Paladin</option><option>Priest</option>
        <option>Rogue</option><option>Shaman</option><option>Warlock</option><option>Warrior</option>
      </select>
    </label>
    <label>Role
      <select name="role"><option value="">–</option><option>Tank</option><option>Healer</option><option>DPS</option></select>
    </label>
    <div class="row">
      <button class="btn btn-primary" type="submit">Save profile</button>
      <button class="btn" id="clear" type="button">Clear</button>
    </div>
  </form>
</main>
<script type="module">
import { renderHeader } from './js/layout.js?v=__V__';
import { supabase, getProfile } from './js/supabase.js?v=__V__';

const user = await renderHeader();
const form = document.getElementById('profile');
const msg = document.getElementById('form-msg');

if (!supabase) { msg.textContent = 'Not connected yet.'; form.querySelectorAll('button').forEach((b) => { b.disabled = true; }); }
else if (!user) { msg.textContent = 'Log in with Discord to edit your profile.'; form.querySelectorAll('button').forEach((b) => { b.disabled = true; }); }
else {
  const p = await getProfile(user);
  if (p) {
    form.character_name.value = p.character_name ?? '';
    form.class.value = p.class ?? '';
    form.role.value = p.role ?? '';
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const d = new FormData(form);
  const { error } = await supabase.from('profiles').upsert({
    user_id: user.id,
    character_name: d.get('character_name').trim() || null,
    class: d.get('class') || null,
    role: d.get('role') || null,
    updated_at: new Date().toISOString(),
  }, { onConflict: 'user_id' });
  msg.textContent = error ? `Could not save: ${error.message}` : 'Saved!';
});

document.getElementById('clear').addEventListener('click', async () => {
  if (!confirm('Are you sure you want to clear your saved character?')) return;
  const { error } = await supabase.from('profiles').delete().eq('user_id', user.id);
  if (!error) form.reset();
  msg.textContent = error ? `Could not clear: ${error.message}` : 'Cleared.';
});
</script>
</body>
</html>
