<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>In Memoriam – Mannenkeuken</title>
<link rel="icon" href="img/icon-128.png?v=__V__" type="image/png" sizes="128x128">
<link rel="icon" href="img/favicon-32.png?v=__V__" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=__V__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=__V__">
<style>
  /* The graveyard: one plot per player, a gravestone per character (our own CSS drawing, no game art) */
  .yard { display: flex; flex-direction: column; gap: 28px; }
  .plot { scroll-margin-top: 90px; padding: 18px 18px 0; border: 1px solid var(--border); border-radius: 10px;
    background: linear-gradient(to bottom, var(--panel) 0%, var(--panel) 78%, color-mix(in srgb, var(--panel) 70%, var(--success, var(--gold)) 8%) 100%); }
  .plot:target { outline: 2px solid var(--gold); outline-offset: 4px; }
  .plot-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin-bottom: 14px; }
  .plot-head h2 { margin: 0; font-size: 22px; }
  .stones { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-end; padding-bottom: 0; }
  /* every gravestone is exactly as high as the others (27 Nov 2026, Jelle); long names and races are cut to two lines */
  .grave { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 170px; }
  .stone { position: relative; width: 170px; height: 280px; padding: 22px 12px 16px; text-align: center; overflow: hidden;
    border-radius: 85px 85px 6px 6px; border: 2px solid color-mix(in srgb, var(--muted) 60%, var(--border));
    background: linear-gradient(160deg, color-mix(in srgb, var(--muted) 38%, var(--panel)) 0%, color-mix(in srgb, var(--muted) 18%, var(--panel)) 70%, color-mix(in srgb, var(--muted) 10%, var(--panel)) 100%);
    box-shadow: inset 0 -10px 18px rgba(0, 0, 0, .35), 0 6px 0 -2px color-mix(in srgb, var(--muted) 25%, var(--panel));
    display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .stone::after { content: ''; position: absolute; left: -14px; right: -14px; bottom: -10px; height: 12px; border-radius: 50%;
    background: color-mix(in srgb, var(--muted) 15%, var(--panel)); z-index: -1; }
  /* the head of the character from the game (media.avatar), faded like an old portrait on a grave; the class icon when the game has none */
  .stone .face { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; border: 2px solid color-mix(in srgb, var(--muted) 70%, var(--border));
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--muted) 25%, var(--panel)); display: flex; align-items: center; justify-content: center; background: var(--panel); }
  .stone .face img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(.25) brightness(.85) contrast(1.05); }
  .stone .face svg { opacity: .6; filter: grayscale(1); }
  .stone .rip { font-family: 'Cinzel', serif; font-weight: 700; letter-spacing: 3px; font-size: 18px; color: var(--text); opacity: .8; }
  .stone .cross { font-size: 22px; line-height: 1; opacity: .7; }
  .stone .who { font-family: 'Cinzel', serif; font-weight: 700; font-size: 15px; line-height: 1.25; word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .stone .what { font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .stone .when { font-size: 12px; margin-top: auto; }
  .stone.quit { border-style: dashed; }
  .stone.quit .rip { letter-spacing: 1px; font-size: 14px; }
  /* respects under a gravestone: the emotes it got and the number of condolences; a click opens the window */
  .respects { all: unset; cursor: pointer; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 4px 8px; min-height: 30px;
    width: 100%; padding: 6px 8px; margin-bottom: 14px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); font-size: 13px; color: var(--muted); }
  .respects:hover, .respects:focus-visible { border-color: var(--gold); color: var(--text); }
  .respects:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
  .respects b { color: var(--text); font-weight: 600; }
  .rip-dialog { width: min(520px, calc(100% - 32px)); padding: 0; }
  .rip-dialog > div { display: flex; flex-direction: column; gap: 14px; padding: 18px; }
  .rip-dialog h2 { margin: 0; font-size: 20px; }
  .rip-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .rip-react { display: flex; flex-wrap: wrap; gap: 6px; }
  .rip-react button { all: unset; cursor: pointer; padding: 4px 9px; border: 1px solid var(--border); border-radius: 999px; font-size: 18px; display: inline-flex; align-items: center; gap: 4px; }
  .rip-react button small { font-size: 12px; color: var(--muted); }
  .rip-react button.mine { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 15%, transparent); }
  .rip-react button:focus-visible { outline: 2px solid var(--gold-bright); }
  .rip-comments { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
  .rip-comment { border-left: 2px solid var(--border); padding-left: 10px; }
  .rip-comment .who { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
  .rip-comment p { margin: 2px 0 0; white-space: pre-wrap; word-break: break-word; }
  .rip-emotes { display: flex; flex-wrap: wrap; gap: 2px; }
  .rip-emotes button { all: unset; cursor: pointer; font-size: 18px; padding: 2px 4px; border-radius: 4px; }
  .rip-emotes button:hover, .rip-emotes button:focus-visible { background: var(--border); }
  .rip-dialog form { display: flex; flex-direction: column; gap: 8px; }
  .rip-dialog textarea { min-height: 70px; resize: vertical; }
  .rip-error { color: var(--warn); margin: 0; }
  .candle { display: inline-block; animation: flicker 2.4s ease-in-out infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; transform: translateY(0); } 50% { opacity: .7; transform: translateY(-1px); } }
  @media (prefers-reduced-motion: reduce) { .candle { animation: none; } }
  .empty { text-align: center; padding: 30px 14px; }
</style>
</head>
<body>
<main>
  <div>
    <h1>In Memoriam</h1>
    <p class="muted">Not logged in for 14 days, or quit. Log in again to rise from the dead.</p>
  </div>
  <section aria-labelledby="yard-title" style="display:flex;flex-direction:column;gap:14px">
    <h2 id="yard-title" style="margin:0">The graveyard <span class="candle" aria-hidden="true">🕯️</span></h2>
    <div id="yard" class="yard"><p class="muted">Loading…</p></div>
  </section>
</main>
<dialog id="rip" class="rip-dialog" aria-labelledby="rip-title">
  <div>
    <div class="rip-head">
      <div><h2 id="rip-title"></h2><span id="rip-sub" class="muted"></span></div>
      <button type="button" id="rip-close" class="link-btn" aria-label="Close">✕</button>
    </div>
    <div id="rip-body"></div>
  </div>
</dialog>
<script type="module">
import { renderHeader } from './js/layout.js?v=__V__';
import { supabase, getUser, mine } from './js/supabase.js?v=__V__';
import { esc, loadBlizzard } from './js/sheet.js?v=__V__';
import { loadCharacters, playerUrl, characterUrl, baseRace } from './js/players.js?v=__V__';
import { classColor, classIcon } from './js/classicons.js?v=__V__';
import { avatarOf, pictureStamp } from './js/charpicture.js?v=__V__';
renderHeader();

const norm = (s) => String(s ?? '').trim().toLowerCase();
const day = (iso) => (iso ? new Date(iso).toLocaleDateString('en-GB', { timeZone: 'Europe/Amsterdam', day: 'numeric', month: 'short', year: 'numeric' }) : '–');
const daysSince = (iso) => Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 86400e3));
const anchor = (player) => `p-${String(player).replace(/\s+/g, '-')}`;

let api = {};
// condolences and emotes per gravestone (27 Nov 2026, Jelle), keyed by the character (lower-case name). Only members can read and write them.
const REACTIONS = ['🕯️', '🌹', '😢', '🙏', '🪦', '🍺', '💀', '😂'];
const EMOTES = ['🕯️', '🌹', '💐', '😢', '😭', '🙏', '🪦', '⚰️', '👻', '💀', '🧟', '🍺', '🍲', '⚔️', '🛡️', '👑', '❤️', '😂', '🫡', '🐔'];
let user = null;
let reactions = []; // { character_key, player_name, emoji }
let counts = {};    // character_key -> number of condolences
function respects(k) {
  if (!user) return '<span>🕯️ Pay respects</span>';
  const list = reactions.filter((r) => r.character_key === k);
  const by = REACTIONS.map((m) => [m, list.filter((r) => r.emoji === m).length]).filter(([, n]) => n);
  const n = counts[k] ?? 0;
  return [by.map(([m, c]) => `<span>${m} <b>${c}</b></span>`).join(''), `<span>💬 <b>${n}</b></span>`, by.length || n ? '' : '<span>Pay respects</span>'].join('');
}
function face(c) {
  const entry = api[norm(c.name)];
  const url = avatarOf(entry);
  return `<span class="face">${url ? `<img src="${esc(url)}?v=${esc(pictureStamp(entry))}" alt="" loading="lazy" onerror="this.hidden = true; this.nextElementSibling.hidden = false"><span hidden>${classIcon(c.class, 34)}</span>` : classIcon(c.class, 34)}</span>`;
}
function stone(c, { quit = false, lastLogin = null } = {}) {
  const cls = c.class ? `<span style="color:${classColor(c.class) || 'inherit'}">${esc(c.class)}</span>` : '';
  const what = [c.level ? `Level ${esc(c.level)}` : '', c.race ? esc(baseRace(c.race)) : '', cls].filter(Boolean).join(' ');
  const seen = lastLogin ?? c.last_login;
  const k = norm(c.name);
  return `<div class="grave"><div class="stone${quit ? ' quit' : ''}">
    ${face(c)}
    <span class="rip">${quit ? 'QUIT' : 'R.I.P.'}</span>
    <a class="who" href="${characterUrl(c.name)}">${esc(c.name)}</a>
    ${what ? `<span class="what muted">${what}</span>` : ''}
    <span class="when muted">${seen ? `Last seen ${esc(day(seen))}${quit ? '' : `<br>Gone for ${daysSince(seen)} days`}` : 'Never seen in the game data'}</span>
  </div><button type="button" class="respects" data-rip="${esc(k)}" data-name="${esc(c.name)}" data-sub="${esc(what.replace(/<[^>]+>/g, ''))}">${respects(k)}</button></div>`;
}

async function load() {
  const [{ data: rows, error }, { characters }, blizzard] = await Promise.all([
    supabase.from('memorial').select('*').order('died_at', { ascending: true }),
    loadCharacters(),
    loadBlizzard(),
  ]);
  if (error) throw error;
  api = blizzard?.characters ?? {};
  user = await getUser().catch(() => null);
  if (user) {
    const [{ data: rs }, { data: cs }] = await Promise.all([
      supabase.from('memorial_reactions').select('character_key, player_name, emoji'),
      supabase.from('memorial_comments').select('character_key'),
    ]);
    reactions = rs ?? [];
    counts = {};
    for (const c of cs ?? []) counts[c.character_key] = (counts[c.character_key] ?? 0) + 1;
  }

  // the dead: rows without risen_at (one per player), plus the Quit characters of players who still play (27 Nov 2026, Jelle: only the graveyard on this page)
  const dead = (rows ?? []).filter((r) => !r.risen_at);
  const resting = new Set(dead.map((r) => r.player_name));
  const quitOf = new Map();
  for (const c of characters.filter((x) => x.status === 'Gestopt' && x.hasName && !resting.has(x.player))) {
    if (!quitOf.has(c.player)) quitOf.set(c.player, []);
    quitOf.get(c.player).push(c);
  }
  const plot = (player, info, stones) => `
    <article class="plot" id="${esc(anchor(player))}">
      <div class="plot-head">
        <h2><a href="${playerUrl(player)}">${esc(player)}</a></h2>
        <span class="muted">${info}</span>
      </div>
      <div class="stones">${stones}</div>
    </article>`;
  const plots = [
    ...dead.map((r) => plot(r.player_name, `Last login ${esc(day(r.last_login))} · in memoriam since ${esc(day(r.died_at))}`, (r.characters ?? []).map((c) => stone(c, { quit: !!c.quit })).join(''))),
    ...[...quitOf].sort(([a], [b]) => a.localeCompare(b)).map(([player, cs]) => plot(player, 'Quit characters',
      cs.map((c) => stone({ name: c.name, level: c.level, race: c.race, class: c.class }, { quit: true, lastLogin: api[norm(c.name)]?.lastLogin ?? null })).join(''))),
  ];
  document.getElementById('yard').innerHTML = plots.join('') || '<p class="muted empty">Nobody rests here. Everyone is still playing! 🍲</p>';

  // a link from Discord (#p-Name): scroll to it once it exists
  if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
}

// ---- the window of one gravestone: emotes and condolences ---------------------------------------------------------------
const dlg = document.getElementById('rip');
let openKey = null;
const when = (iso) => new Date(iso).toLocaleString('en-GB', { timeZone: 'Europe/Amsterdam', hourCycle: 'h23', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
function refreshStone(k) {
  const b = document.querySelector(`.respects[data-rip="${CSS.escape(k)}"]`);
  if (b) b.innerHTML = respects(k);
}
async function drawDialog(errorText = '') {
  const k = openKey; const body = document.getElementById('rip-body');
  if (!user) {
    body.innerHTML = '<p class="muted">Choose your player (top right) to leave an emote or a condolence.</p>';
    return;
  }
  const { data, error } = await supabase.from('memorial_comments').select('*').eq('character_key', k).order('created_at');
  if (k !== openKey) return;
  const list = reactions.filter((r) => r.character_key === k);
  const mineR = list.find((r) => r.player_name === user.player)?.emoji;
  counts[k] = data?.length ?? counts[k] ?? 0;
  body.innerHTML = `
    <div class="rip-react" role="group" aria-label="Emotes">${REACTIONS.map((m) => {
      const who = list.filter((r) => r.emoji === m).map((r) => r.player_name);
      return `<button type="button" data-react="${m}" class="${mineR === m ? 'mine' : ''}" aria-pressed="${mineR === m}" title="${esc(who.join(', ') || 'React with ' + m)}">${m}${who.length ? `<small>${who.length}</small>` : ''}</button>`;
    }).join('')}</div>
    ${errorText ? `<p class="rip-error">${esc(errorText)}</p>` : ''}
    <div class="rip-comments">${error ? `<p class="muted">Could not load the condolences: ${esc(error.message)}</p>`
      : (data ?? []).map((c) => `<div class="rip-comment"><div class="who"><a href="${playerUrl(c.player_name)}"><b>${esc(c.player_name)}</b></a><span class="muted">${esc(when(c.created_at))}</span>${mine(user, c.user_id) ? `<button type="button" class="link-btn" data-del="${esc(c.id)}">Delete</button>` : ''}</div><p>${esc(c.body)}</p></div>`).join('')
        || '<p class="muted">No condolences yet. Be the first.</p>'}</div>
    <form id="rip-form">
      <label>Leave a condolence<textarea name="body" maxlength="500" required placeholder="Rest in peace, old friend…"></textarea></label>
      <div class="rip-emotes" aria-label="Add an emote">${EMOTES.map((m) => `<button type="button" title="Add ${m}">${m}</button>`).join('')}</div>
      <div><button type="submit">Post</button></div>
    </form>`;
  refreshStone(k);
}
document.getElementById('yard').addEventListener('click', (e) => {
  const b = e.target.closest('.respects');
  if (!b) return;
  openKey = b.dataset.rip;
  document.getElementById('rip-title').textContent = `🪦 ${b.dataset.name}`;
  document.getElementById('rip-sub').textContent = b.dataset.sub || '';
  document.getElementById('rip-body').innerHTML = '<p class="muted">Loading…</p>';
  dlg.showModal();
  drawDialog();
});
document.getElementById('rip-close').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener('click', async (e) => {
  const react = e.target.closest('[data-react]');
  if (react) {
    const k = openKey; const m = react.dataset.react;
    const mineR = reactions.find((r) => r.character_key === k && r.player_name === user.player)?.emoji;
    const next = mineR === m ? null : m; // the same emote again = take it back
    const { error } = await supabase.rpc('set_memorial_reaction', { p_character: k, p_emoji: next });
    if (error) { drawDialog(`Could not save the emote: ${error.message}`); return; }
    reactions = reactions.filter((r) => !(r.character_key === k && r.player_name === user.player));
    if (next) reactions.push({ character_key: k, player_name: user.player, emoji: next });
    drawDialog();
    return;
  }
  const emote = e.target.closest('.rip-emotes button');
  if (emote) {
    const ta = dlg.querySelector('textarea');
    const at = ta.selectionStart ?? ta.value.length;
    ta.setRangeText(emote.textContent, at, ta.selectionEnd ?? at, 'end');
    ta.focus();
    return;
  }
  const del = e.target.closest('[data-del]');
  if (del) {
    if (!confirm('Are you sure you want to delete this condolence?')) return;
    const { error } = await supabase.from('memorial_comments').delete().eq('id', del.dataset.del);
    drawDialog(error ? `Could not delete: ${error.message}` : '');
  }
});
dlg.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target; const text = f.body.value.trim();
  if (!text) return;
  f.querySelector('button[type="submit"]').disabled = true;
  const { error } = await supabase.from('memorial_comments').insert({ character_key: openKey, body: text, player_name: user.player });
  drawDialog(error ? `Could not post: ${error.message}` : '');
});

load().catch(() => {
  document.getElementById('yard').innerHTML = '<p class="muted">Could not read the graveyard. Try again later.</p>';
});
</script>
</body>
</html>
