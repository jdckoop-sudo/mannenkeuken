<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster – Mannenkeuken</title>
<link rel="icon" href="img/logo-mark.png?v=__V__" type="image/png" sizes="128x128">
<link rel="icon" href="img/favicon-32.png?v=__V__" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=__V__">
<link rel="stylesheet" href="css/style.css?v=__V__">
<script>const whTooltips = { colorLinks: false, iconizeLinks: false, renameLinks: false };</script>
<script src="https://wow.zamimg.com/js/tooltips.js" async></script>
<style>
  th button { all: unset; cursor: pointer; font-weight: 700; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap; }
  th button:focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }
  td.num { text-align: right; }
</style>
</head>
<body>
<main>
  <div>
    <h1>Roster</h1>
    <p class="muted">Read live from the Guild Professions sheet. Click a column to sort.</p>
  </div>
  <form class="box" style="flex-direction: row; flex-wrap: wrap; align-items: flex-end" onsubmit="return false">
    <label style="flex: 1 1 220px">Search<input id="q" type="search" placeholder="Player, character or profession"></label>
    <label>Role<select id="role"><option value="">All roles</option><option>Tank</option><option>Healer</option><option>DPS</option></select></label>
    <label>Status<select id="status"><option>Main</option><option>Alt</option><option>Gestopt</option><option value="">All</option></select></label>
  </form>
  <div class="table-wrap">
    <table>
      <thead><tr id="head"></tr></thead>
      <tbody id="rows"><tr><td colspan="14">Loading…</td></tr></tbody>
    </table>
  </div>
</main>
<script type="module">
import { renderHeader } from './js/layout.js?v=__V__';
import { loadMembers, esc } from './js/sheet.js?v=__V__';
import { professionLabel } from './js/proficons.js?v=__V__';
renderHeader();

const n = (v) => (v === '' || v == null || isNaN(Number(v)) ? null : Number(v));
const prof = (p, s) => (p ? `${professionLabel(p, { size: 18 })}${s ? ` <span class="muted">(${esc(s)})</span>` : ''}` : '');
// key, label, value used for sorting, cell html, numeric?
const cols = [
  ['player', 'Player', (m) => m.player, (m) => `<a href="player.html?name=${encodeURIComponent(m.player)}">${esc(m.player)}</a>`],
  ['character', 'Character', (m) => m.character, (m) => (m.character ? `<a href="character.html?name=${encodeURIComponent(m.character)}">${esc(m.character)}</a>` : '')],
  ['race', 'Race', (m) => m.race, (m) => esc(m.race)],
  ['cls', 'Class', (m) => m.cls, (m) => esc(m.cls)],
  ['role', 'Role', (m) => m.role, (m) => esc(m.role)],
  ['level', 'Level', (m) => n(m.level), (m) => esc(m.level), true],
  ['prof1', 'Profession 1', (m) => n(m.skill1), (m) => prof(m.prof1, m.skill1), true],
  ['prof2', 'Profession 2', (m) => n(m.skill2), (m) => prof(m.prof2, m.skill2), true],
  ['cooking', 'Cooking', (m) => n(m.cooking), (m) => esc(m.cooking), true],
  ['firstAid', 'First Aid', (m) => n(m.firstAid), (m) => esc(m.firstAid), true],
  ['fishing', 'Fishing', (m) => n(m.fishing), (m) => esc(m.fishing), true],
  ['recipes', 'Key recipes', (m) => m.recipes, (m) => esc(m.recipes)],
  ['notes', 'Notes', (m) => m.notes, (m) => esc(m.notes)],
  ['status', 'Status', (m) => m.status, (m) => esc(m.status)],
  ['updated', 'Last updated', (m) => m.updated?.split('-').reverse().join(''), (m) => esc(m.updated)],
];

let members = [];
let sortKey = null;
let sortDir = 1; // 1 = low → high, -1 = high → low

function drawHead() {
  document.getElementById('head').innerHTML = cols.map(([key, label]) => {
    const active = key === sortKey;
    const arrow = active ? (sortDir === 1 ? '▲' : '▼') : '';
    const aria = active ? (sortDir === 1 ? 'ascending' : 'descending') : 'none';
    return `<th aria-sort="${aria}"><button type="button" data-key="${key}">${label}<span aria-hidden="true">${arrow}</span></button></th>`;
  }).join('');
}

function draw() {
  const q = document.getElementById('q').value.toLowerCase();
  const role = document.getElementById('role').value;
  const status = document.getElementById('status').value;
  let list = members.filter((m) =>
    (!q || `${m.player} ${m.character} ${m.prof1} ${m.prof2}`.toLowerCase().includes(q)) &&
    (!role || m.role === role) && (!status || m.status === status));
  if (sortKey) {
    const col = cols.find((c) => c[0] === sortKey);
    list = [...list].sort((a, b) => {
      const x = col[2](a); const y = col[2](b);
      const ex = x == null || x === ''; const ey = y == null || y === '';
      if (ex || ey) return ex - ey; // empty values always last
      return (col[4] ? x - y : String(x).localeCompare(String(y))) * sortDir;
    });
  }
  document.getElementById('rows').innerHTML = list.map((m) => `<tr>${cols.map((c) => `<td class="${c[4] ? 'num' : ''}">${c[3](m)}</td>`).join('')}</tr>`).join('')
    || `<tr><td colspan="${cols.length}">No players found.</td></tr>`;
  drawHead();
}

document.getElementById('head').addEventListener('click', (e) => {
  const key = e.target.closest('button')?.dataset.key;
  if (!key) return;
  sortDir = key === sortKey ? -sortDir : 1;
  sortKey = key;
  draw();
});
['q', 'role', 'status'].forEach((id) => document.getElementById(id).addEventListener('input', draw));
drawHead();
loadMembers().then((m) => { members = m; draw(); }).catch(() => {
  document.getElementById('rows').innerHTML = `<tr><td colspan="${cols.length}">Could not read the sheet. Is it shared as "Anyone with the link can view"?</td></tr>`;
});
</script>
</body>
</html>
