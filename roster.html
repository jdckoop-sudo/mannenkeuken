<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster – Mannenkeuken</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <div>
    <h1>Roster</h1>
    <p class="muted">Read live from the Guild Professions sheet</p>
  </div>
  <form class="box" style="flex-direction: row; flex-wrap: wrap; align-items: flex-end" onsubmit="return false">
    <label style="flex: 1 1 220px">Search<input id="q" type="search" placeholder="Player or character"></label>
    <label>Role<select id="role"><option value="">All roles</option><option>Tank</option><option>Healer</option><option>DPS</option></select></label>
    <label>Status<select id="status"><option>Main</option><option>Alt</option><option>Gestopt</option><option value="">All</option></select></label>
  </form>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Player</th><th>Character</th><th>Race</th><th>Class</th><th>Role</th><th>Level</th><th>Profession 1</th><th>Profession 2</th><th>Status</th><th>Last updated</th></tr></thead>
      <tbody id="rows"><tr><td colspan="10">Loading…</td></tr></tbody>
    </table>
  </div>
</main>
<script type="module">
import { renderHeader } from './js/layout.js';
import { loadMembers, esc } from './js/sheet.js';
renderHeader();

let members = [];
const prof = (p, s) => (p ? `${esc(p)}${s ? ` (${esc(s)})` : ''}` : '');
function draw() {
  const q = document.getElementById('q').value.toLowerCase();
  const role = document.getElementById('role').value;
  const status = document.getElementById('status').value;
  const list = members.filter((m) =>
    (!q || `${m.player} ${m.character}`.toLowerCase().includes(q)) &&
    (!role || m.role === role) && (!status || m.status === status));
  document.getElementById('rows').innerHTML = list.map((m) => `<tr>
    <td>${esc(m.player)}</td><td>${esc(m.character)}</td><td>${esc(m.race)}</td><td>${esc(m.cls)}</td><td>${esc(m.role)}</td>
    <td>${esc(m.level)}</td><td>${prof(m.prof1, m.skill1)}</td><td>${prof(m.prof2, m.skill2)}</td><td>${esc(m.status)}</td><td>${esc(m.updated)}</td>
  </tr>`).join('') || '<tr><td colspan="10">No players found.</td></tr>';
}
['q', 'role', 'status'].forEach((id) => document.getElementById(id).addEventListener('input', draw));
loadMembers().then((m) => { members = m; draw(); }).catch(() => {
  document.getElementById('rows').innerHTML = '<tr><td colspan="10">Could not read the sheet. Is it shared as "Anyone with the link can view"?</td></tr>';
});
</script>
</body>
</html>
