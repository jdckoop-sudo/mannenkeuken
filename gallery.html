<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery – Mannenkeuken</title>
<link rel="icon" href="img/icon-128.png?v=__V__" type="image/png" sizes="128x128">
<link rel="icon" href="img/favicon-32.png?v=__V__" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png?v=__V__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=__V__">
<style>
  /* The museum: every picture hangs in a carved walnut frame with a thin gilded slip, like an old and very expensive
     painting, lit from above, with a brass plaque underneath. Only CSS (gradients and shadows), no images. */
  .gal-tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end; }
  .gal-tools label { max-width: 220px; }
  .gal-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 44px 34px; padding: 26px 0 32px; align-items: start; }
  .gal-piece { position: relative; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; color: inherit; font: inherit; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .gal-piece::before { /* the gallery spotlight on the wall */
    content: ''; position: absolute; left: 50%; top: -30px; width: 130%; height: 75%; transform: translateX(-50%); pointer-events: none;
    background: radial-gradient(ellipse at 50% 0, rgb(255 236 190 / .16), transparent 70%); }
  .gal-wall, .gal-view { /* wood tones for the frames (only used on this page) */
    --wood-dark: rgb(46 26 14); --wood: rgb(92 54 28); --wood-mid: rgb(120 74 38); --wood-light: rgb(158 104 58); }
  .gal-frame { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; box-sizing: border-box; border-radius: 2px;
    /* carved walnut moulding: wood grain, light from the top left, a thin gold bead only around the painting */
    background:
      repeating-linear-gradient(92deg, rgb(0 0 0 / .14) 0 1px, transparent 1px 7px, rgb(255 220 170 / .05) 7px 8px, transparent 8px 13px),
      repeating-linear-gradient(88deg, transparent 0 21px, rgb(0 0 0 / .10) 21px 23px, transparent 23px 37px),
      linear-gradient(135deg, var(--wood-light), var(--wood-mid) 18%, var(--wood) 45%, var(--wood-dark) 75%, var(--wood) 100%);
    border: 2px solid var(--wood-dark);
    box-shadow:
      inset 0 0 0 3px var(--wood-mid), inset 0 0 0 5px var(--wood-dark),             /* outer edge */
      inset 0 0 0 13px transparent, inset 0 0 0 14px rgb(0 0 0 / .45),                /* carved step */
      inset 4px 4px 7px rgb(255 225 180 / .25), inset -4px -4px 9px rgb(0 0 0 / .55), /* light from the top left */
      0 0 0 1px var(--bg), 0 14px 26px rgb(0 0 0 / .65), 0 4px 8px rgb(0 0 0 / .5);
    transition: transform .25s ease, box-shadow .25s ease; }
  .gal-frame::before { /* thin gilded slip and a dark lip around the canvas */
    content: ''; position: absolute; inset: 24px; z-index: 1; pointer-events: none;
    box-shadow: 0 0 0 1px var(--wood-dark), 0 0 0 3px var(--gold-dim), 0 0 0 4px var(--gold), 0 0 0 6px var(--wood-dark), inset 0 0 0 1px var(--bg); }
  .gal-frame::after { /* varnish: old-painting vignette and a soft sheen */
    content: ''; position: absolute; inset: 24px; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgb(20 10 0 / .45) 100%), linear-gradient(160deg, rgb(255 244 214 / .10), transparent 40%); }
  .gal-frame > img, .gal-frame > video { position: absolute; inset: 24px; width: calc(100% - 48px); height: calc(100% - 48px); object-fit: cover; display: block; background: var(--bg); }
  .gal-piece:hover .gal-frame, .gal-piece:focus-visible .gal-frame { transform: translateY(-5px) scale(1.025);
    box-shadow:
      inset 0 0 0 3px var(--wood-mid), inset 0 0 0 5px var(--wood-dark), inset 0 0 0 13px transparent, inset 0 0 0 14px rgb(0 0 0 / .45),
      inset 4px 4px 7px rgb(255 225 180 / .25), inset -4px -4px 9px rgb(0 0 0 / .55),
      0 0 0 1px var(--bg), 0 22px 40px rgb(0 0 0 / .7), 0 0 22px rgb(255 220 160 / .18); }
  .gal-piece:focus-visible { outline: none; }
  .gal-play { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; font-size: 42px; color: var(--text); text-shadow: 0 2px 10px rgb(0 0 0 / .9); pointer-events: none; }
  .gal-plaque { /* engraved brass plate */
    background: linear-gradient(180deg, var(--gold-bright), var(--gold) 45%, var(--gold-dim)); color: var(--bg);
    border: 1px solid var(--gold-dim); border-radius: 2px; padding: 5px 16px; font-size: 13px; line-height: 1.35; max-width: 92%;
    box-shadow: inset 0 1px 0 rgb(255 255 255 / .45), 0 3px 6px rgb(0 0 0 / .5); text-shadow: 0 1px 0 rgb(255 255 255 / .35); }
  .gal-plaque b { font-family: var(--font-display); font-weight: 700; letter-spacing: .04em; }
  .gal-plaque .muted { font-size: 12px; color: var(--bg); opacity: .8; }
  .gal-title-edit { display: flex; flex-direction: column; gap: 6px; }
  .gal-title-edit div { display: flex; gap: 6px; }
  #gal-title-btn { align-self: flex-start; font-size: 13px; padding: 4px 10px; min-height: 0; }
  .gal-count { font-size: 12px; color: var(--muted); }
  .gal-reacts { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; font-size: 13px; min-height: 22px; }
  .gal-reacts span { background: var(--panel-2); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; color: var(--text); }
  .gal-reactbar { display: flex; flex-wrap: wrap; gap: 6px; }
  .gal-reactbar button { display: inline-flex; align-items: center; gap: 4px; font-size: 18px; line-height: 1; padding: 5px 9px; min-height: 0; background: var(--field); border: 1px solid var(--border); border-radius: 999px; color: var(--text); cursor: pointer; }
  .gal-reactbar button small { font-size: 12px; color: var(--muted); }
  .gal-reactbar button.mine { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
  .gal-reactbar button:hover { transform: scale(1.08); }
  .gal-who-reacted { font-size: 12px; margin: 0; }
  #gal-upload { display: flex; flex-direction: column; gap: 10px; max-width: 560px; }
  #gal-upload[hidden] { display: none; }

  /* Lightbox */
  .gal-view { position: fixed; inset: 0; z-index: 100; background: rgb(0 0 0 / .9); display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
  .gal-view[hidden] { display: none; }
  .gal-stage { position: relative; display: flex; align-items: center; justify-content: center; padding: 24px 56px; min-height: 0; }
  .gal-bigframe { /* the same carved walnut frame as on the wall, around the big picture */
    position: relative; display: inline-block; padding: 24px; border-radius: 2px;
    background:
      repeating-linear-gradient(92deg, rgb(0 0 0 / .14) 0 1px, transparent 1px 7px, rgb(255 220 170 / .05) 7px 8px, transparent 8px 13px),
      repeating-linear-gradient(88deg, transparent 0 21px, rgb(0 0 0 / .10) 21px 23px, transparent 23px 37px),
      linear-gradient(135deg, var(--wood-light), var(--wood-mid) 18%, var(--wood) 45%, var(--wood-dark) 75%, var(--wood) 100%);
    border: 2px solid var(--wood-dark);
    box-shadow:
      inset 0 0 0 3px var(--wood-mid), inset 0 0 0 5px var(--wood-dark), inset 0 0 0 13px transparent, inset 0 0 0 14px rgb(0 0 0 / .45),
      inset 4px 4px 7px rgb(255 225 180 / .25), inset -4px -4px 9px rgb(0 0 0 / .55), 0 24px 70px rgb(0 0 0 / .85); }
  .gal-bigframe > img, .gal-bigframe > video { display: block; max-width: calc(100vw - 340px - 160px); max-height: calc(100vh - 150px); background: var(--bg);
    box-shadow: 0 0 0 1px var(--wood-dark), 0 0 0 3px var(--gold-dim), 0 0 0 4px var(--gold), 0 0 0 6px var(--wood-dark); }
  .gal-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; font-size: 28px; padding: 0; }
  .gal-nav.prev { left: 6px; } .gal-nav.next { right: 6px; }
  .gal-side { background: var(--panel); border-left: 1px solid var(--border-strong); padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
  .gal-side h2 { margin: 0; font-size: 18px; }
  .gal-close { align-self: flex-end; }
  .gal-caption { font-style: italic; color: var(--text); margin: 0; white-space: pre-wrap; }
  .gal-comments { display: flex; flex-direction: column; gap: 10px; }
  .gal-comment { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 2px; }
  .gal-comment p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .gal-comment .who { display: flex; gap: 8px; align-items: baseline; font-size: 13px; }
  .gal-comment .who .muted { font-size: 12px; }
  .gal-comment button { align-self: flex-start; font-size: 12px; padding: 2px 8px; min-height: 0; }
  #gal-form { display: flex; flex-direction: column; gap: 8px; }
  #gal-form textarea { min-height: 70px; resize: vertical; }
  .gal-emotes { display: flex; flex-wrap: wrap; gap: 4px; }
  .gal-emotes button { font-size: 20px; line-height: 1; padding: 4px 6px; min-height: 0; background: var(--field); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; }
  .gal-emotes button:hover, .gal-emotes button:focus-visible { border-color: var(--gold); transform: scale(1.15); }
  @media (max-width: 800px) {
    .gal-view { grid-template-columns: 1fr; grid-template-rows: minmax(0, 55vh) 1fr; }
    .gal-stage { padding: 12px 44px; }
    .gal-bigframe { padding: 14px; }
    .gal-bigframe > img, .gal-bigframe > video { max-width: calc(100vw - 130px); max-height: calc(55vh - 60px); }
    .gal-side { border-left: 0; border-top: 1px solid var(--border-strong); }
  }
  @media (prefers-reduced-motion: reduce) { .gal-frame { transition: none; } .gal-piece:hover .gal-frame { transform: none; } }
</style>
</head>
<body>
<main>
  <section class="page-head"><div>
    <h1>Gallery</h1>
    <p class="muted">Screenshots and clips from our adventures. Click a picture to see it big, with who posted it and when, react with an emote and leave a comment.</p>
  </div><button class="btn btn-primary" type="button" id="gal-upload-open" hidden>+ Upload</button></section>

  <form class="box" id="gal-upload" hidden>
    <h2>Add to the gallery</h2>
    <label>Picture or clip (max. 50 MB)<input type="file" name="file" accept="image/*,video/*" required></label>
    <label>Title (optional)<input name="gtitle" maxlength="80" placeholder="Give it a name…"></label>
    <label>Caption (optional)<textarea name="caption" maxlength="500" placeholder="What happened here?"></textarea></label>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn btn-primary" type="submit">Upload</button><button class="btn" type="button" id="gal-upload-cancel">Cancel</button><span class="muted" id="gal-upload-status"></span></div>
  </form>

  <div id="gal-body"><p class="muted">Loading…</p></div>
</main>

<div class="gal-view" id="gal-view" hidden role="dialog" aria-modal="true" aria-label="Gallery item">
  <div class="gal-stage">
    <button class="btn gal-nav prev" type="button" id="gal-prev" aria-label="Previous">&#8249;</button>
    <div id="gal-media"></div>
    <button class="btn gal-nav next" type="button" id="gal-next" aria-label="Next">&#8250;</button>
  </div>
  <aside class="gal-side">
    <button class="btn gal-close" type="button" id="gal-close">Close ✕</button>
    <div id="gal-info"></div>
    <div class="gal-reactbar" id="gal-reactbar" role="group" aria-label="React"></div>
    <p class="muted gal-who-reacted" id="gal-who-reacted"></p>
    <h2>Comments</h2>
    <div class="gal-comments" id="gal-comments"></div>
    <form id="gal-form">
      <label>Add a comment<textarea name="body" maxlength="1000" required placeholder="Say something about this one…"></textarea></label>
      <div class="gal-emotes" id="gal-emotes" role="group" aria-label="Add an emote"></div>
      <button class="btn btn-primary" type="submit">Post comment</button>
    </form>
  </aside>
</div>

<script type="module">
import { renderHeader } from './js/layout.js?v=__V__';
import { supabase, mine } from './js/supabase.js?v=__V__';
import { esc } from './js/sheet.js?v=__V__';
import { playerUrl } from './js/players.js?v=__V__';

const user = await renderHeader();
const body = document.getElementById('gal-body');
const when = (iso) => new Date(iso).toLocaleString('en-GB', { timeZone: 'Europe/Amsterdam', hourCycle: 'h23', day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const posterHtml = (it) => (it.player_name
  ? `<a href="${playerUrl(it.player_name)}">${esc(it.player_name)}</a>`
  : esc(it.poster || 'Unknown'));

// Upload: every member can add a picture or clip of their own (file in uploads/, row via add_gallery_item()).
if (user && supabase) {
  const form = document.getElementById('gal-upload');
  const openBtn = document.getElementById('gal-upload-open');
  openBtn.hidden = false;
  openBtn.addEventListener('click', () => { form.hidden = false; openBtn.hidden = true; form.file.focus(); });
  document.getElementById('gal-upload-cancel').addEventListener('click', () => { form.reset(); form.hidden = true; openBtn.hidden = false; });
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const status = document.getElementById('gal-upload-status');
    const file = form.file.files[0];
    if (!file) return;
    const kind = file.type.startsWith('video/') ? 'video' : file.type.startsWith('image/') ? 'image' : null;
    if (!kind) { status.textContent = 'Only pictures and clips can be uploaded.'; return; }
    if (file.size > 50 * 1024 * 1024) { status.textContent = 'This file is bigger than 50 MB.'; return; }
    const ext = (file.name.split('.').pop() || (kind === 'video' ? 'mp4' : 'png')).toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5);
    const path = `uploads/${crypto.randomUUID()}.${ext}`;
    form.querySelector('button[type="submit"]').disabled = true;
    status.textContent = 'Uploading…';
    const up = await supabase.storage.from('gallery').upload(path, file, { contentType: file.type });
    if (up.error) { status.textContent = `Upload failed: ${up.error.message}`; form.querySelector('button[type="submit"]').disabled = false; return; }
    const { error: e5 } = await supabase.rpc('add_gallery_item', { p_path: path, p_kind: kind, p_title: form.elements.gtitle.value.trim(), p_caption: form.caption.value.trim(), p_bytes: file.size });
    if (e5) { status.textContent = `Could not add it: ${e5.message}`; form.querySelector('button[type="submit"]').disabled = false; return; }
    status.textContent = 'Added!';
    location.reload();
  });
}

// The gallery is for members only: the pictures are private (storage bucket "gallery", read = is_member()).
if (!user || !supabase) {
  body.innerHTML = '<div class="box"><p style="margin:0">Choose your player (top right) to see the gallery.</p></div>';
} else {
  const [{ data: items, error }, { data: counts }, { data: reacts }] = await Promise.all([
    supabase.from('gallery_items').select('*').order('posted_at', { ascending: false }),
    supabase.from('gallery_comments').select('item_id'),
    supabase.from('gallery_reactions').select('item_id, player_name, emoji'),
  ]);
  if (error) {
    body.innerHTML = `<div class="box"><p style="margin:0">The gallery could not be loaded: ${esc(error.message)}</p></div>`;
  } else if (!items.length) {
    body.innerHTML = '<div class="box"><p style="margin:0">The gallery is still empty.</p></div>';
  } else {
    const nComments = {};
    for (const c of counts ?? []) nComments[c.item_id] = (nComments[c.item_id] ?? 0) + 1;
    // Reactions: one emote per player per item (like Facebook). byItem[id] = [{ player_name, emoji }]
    const REACTIONS = ['👍', '❤️', '😂', '😮', '😢', '🔥', '💀', '🏆'];
    const byItem = {};
    for (const r of reacts ?? []) (byItem[r.item_id] ??= []).push(r);
    const tally = (id) => {
      const t = {};
      for (const r of byItem[id] ?? []) t[r.emoji] = (t[r.emoji] ?? 0) + 1;
      return Object.entries(t).sort((a, b) => b[1] - a[1]);
    };
    const reactsHtml = (id) => tally(id).map(([m, n]) => `<span title="${n} × ${m}">${m} ${n}</span>`).join('');
    // Private files: signed links, valid for 6 hours.
    const { data: signed } = await supabase.storage.from('gallery').createSignedUrls(items.map((i) => i.path), 6 * 3600);
    const urlOf = new Map((signed ?? []).map((s) => [s.path, s.signedUrl]));
    for (const it of items) it.url = urlOf.get(it.path);
    const posters = [...new Set(items.map((i) => i.player_name || i.poster).filter(Boolean))].sort((a, b) => a.localeCompare(b));

    body.innerHTML = `
      <div class="gal-tools">
        <label>Posted by<select id="gal-who"><option value="">Everyone</option>${posters.map((p) => `<option>${esc(p)}</option>`).join('')}</select></label>
        <label>Show<select id="gal-kind"><option value="">Pictures and clips</option><option value="image">Pictures</option><option value="video">Clips</option></select></label>
        <span class="gal-count" id="gal-count"></span>
      </div>
      <div class="gal-wall" id="gal-wall"></div>`;

    const { data: isDev } = await supabase.rpc('is_dev');
    let shown = items;
    const wall = document.getElementById('gal-wall');
    function draw() {
      const who = document.getElementById('gal-who').value;
      const kind = document.getElementById('gal-kind').value;
      shown = items.filter((i) => (!who || (i.player_name || i.poster) === who) && (!kind || i.kind === kind));
      document.getElementById('gal-count').textContent = `${shown.length} of ${items.length}`;
      wall.innerHTML = shown.map((it, n) => `
        <button class="gal-piece" type="button" data-n="${n}" aria-label="Open ${it.title ? `${esc(it.title)}, ` : ''}${it.kind === 'video' ? 'clip' : 'picture'} posted by ${esc(it.player_name || it.poster || 'unknown')}">
          <span class="gal-frame">${it.kind === 'video'
            ? `<video src="${esc(it.url ?? '')}#t=1" preload="metadata" muted playsinline></video><span class="gal-play" aria-hidden="true">&#9654;</span>`
            : `<img src="${esc(it.url ?? '')}" alt="" loading="lazy">`}</span>
          <span class="gal-plaque">${it.title
            ? `<b>${esc(it.title)}</b><br><span class="muted">${esc(it.player_name || it.poster || 'Unknown')} · ${when(it.posted_at)}`
            : `<b>${esc(it.player_name || it.poster || 'Unknown')}</b><br><span class="muted">${when(it.posted_at)}`}${nComments[it.id] ? ` · &#128172; ${nComments[it.id]}` : ''}</span></span>
          <span class="gal-reacts" aria-label="Reactions">${reactsHtml(it.id)}</span>
        </button>`).join('');
    }
    document.getElementById('gal-who').addEventListener('change', draw);
    document.getElementById('gal-kind').addEventListener('change', draw);
    wall.addEventListener('click', (e) => { const b = e.target.closest('.gal-piece'); if (b) open(+b.dataset.n); });
    draw();

    // ---- the big view ---------------------------------------------------------------------------------------------
    const view = document.getElementById('gal-view');
    let current = -1;
    async function loadComments(it) {
      const box = document.getElementById('gal-comments');
      box.innerHTML = '<p class="muted">Loading…</p>';
      const { data, error: e } = await supabase.from('gallery_comments').select('*').eq('item_id', it.id).order('created_at');
      if (e) { box.innerHTML = `<p class="muted">Could not load comments: ${esc(e.message)}</p>`; return; }
      nComments[it.id] = data.length;
      box.innerHTML = data.length ? data.map((c) => `
        <div class="gal-comment">
          <div class="who"><a href="${playerUrl(c.player_name)}"><b>${esc(c.player_name)}</b></a><span class="muted">${when(c.created_at)}</span></div>
          <p>${esc(c.body)}</p>
          ${mine(user, c.user_id) ? `<button class="btn" type="button" data-del="${c.id}">Delete</button>` : ''}
        </div>`).join('') : '<p class="muted">No comments yet. Be the first!</p>';
    }
    function open(n) {
      if (!shown.length) return;
      current = (n + shown.length) % shown.length;
      const it = shown[current];
      document.getElementById('gal-media').innerHTML = it.kind === 'video'
        ? `<span class="gal-bigframe"><video src="${esc(it.url ?? '')}" controls autoplay playsinline></video></span>`
        : `<span class="gal-bigframe"><img src="${esc(it.url ?? '')}" alt="Picture posted by ${esc(it.player_name || it.poster || 'unknown')}"></span>`;
      drawInfo(it);
      drawReacts(it);
      const many = shown.length > 1;
      document.getElementById('gal-prev').hidden = !many;
      document.getElementById('gal-next').hidden = !many;
      view.hidden = false;
      document.body.style.overflow = 'hidden';
      loadComments(it);
    }
    function drawReacts(it) {
      const list = byItem[it.id] ?? [];
      const mineR = list.find((r) => r.player_name === user.player)?.emoji;
      const count = (m) => list.filter((r) => r.emoji === m).length;
      document.getElementById('gal-reactbar').innerHTML = REACTIONS.map((m) => `<button type="button" data-react="${m}" class="${mineR === m ? 'mine' : ''}" title="${esc(list.filter((r) => r.emoji === m).map((r) => r.player_name).join(', ') || 'React with ' + m)}">${m}${count(m) ? `<small>${count(m)}</small>` : ''}</button>`).join('');
      document.getElementById('gal-who-reacted').textContent = list.length ? list.map((r) => `${r.emoji} ${r.player_name}`).join(' · ') : 'No reactions yet.';
    }
    document.getElementById('gal-reactbar').addEventListener('click', async (e) => {
      const m = e.target.closest('[data-react]')?.dataset.react;
      if (!m) return;
      const it = shown[current];
      const list = byItem[it.id] ??= [];
      const mineR = list.find((r) => r.player_name === user.player);
      const next = mineR?.emoji === m ? null : m; // same emote again = take it back
      const { error: e6 } = await supabase.rpc('set_gallery_reaction', { p_id: it.id, p_emoji: next });
      if (e6) { alert(`Could not react: ${e6.message}`); return; }
      byItem[it.id] = list.filter((r) => r.player_name !== user.player);
      if (next) byItem[it.id].push({ item_id: it.id, player_name: user.player, emoji: next });
      drawReacts(it);
    });
    // Title: every member may give an item a title or change it (database function set_gallery_title()).
    function drawInfo(it) {
      document.getElementById('gal-info').innerHTML = `
        <h2>${it.title ? esc(it.title) : '<span class="muted">Untitled</span>'}</h2>
        <button class="btn" type="button" id="gal-title-btn">&#9998; ${it.title ? 'Edit title' : 'Add a title'}</button>
        ${it.title_by ? `<p class="muted" style="font-size:12px">Title by ${esc(it.title_by)}</p>` : ''}
        <p class="muted">Posted by ${posterHtml(it)} · ${when(it.posted_at)}${it.poster && it.player_name && it.poster !== it.player_name ? ` · on Discord as ${esc(it.poster)}` : ''}</p>
        ${it.caption ? `<p class="gal-caption">“${esc(it.caption)}”</p>` : ''}
        ${(it.source === 'upload' && it.player_name === user.player) || isDev ? '<button class="btn" type="button" id="gal-delete" style="align-self:flex-start;font-size:12px;padding:2px 8px;min-height:0">Remove from the gallery</button>' : ''}`;
    }
    document.getElementById('gal-info').addEventListener('click', async (e) => {
      if (e.target.closest('#gal-delete')) {
        const it = shown[current];
        if (!confirm('Are you sure you want to remove this from the gallery? This cannot be undone.')) return;
        const { data: path, error: e7 } = await supabase.rpc('delete_gallery_item', { p_id: it.id });
        if (e7) { alert(`Could not remove it: ${e7.message}`); return; }
        await supabase.storage.from('gallery').remove([path]);
        location.reload();
        return;
      }
      if (!e.target.closest('#gal-title-btn')) return;
      const it = shown[current];
      const h = document.querySelector('#gal-info h2');
      h.outerHTML = `<form class="gal-title-edit" id="gal-title-form"><label>Title<input name="gtitle" maxlength="80" value="${esc(it.title ?? '')}" placeholder="Give this one a name…"></label>
        <div><button class="btn btn-primary" type="submit">Save</button><button class="btn" type="button" id="gal-title-cancel">Cancel</button></div></form>`;
      document.getElementById('gal-title-btn').remove();
      const f = document.getElementById('gal-title-form');
      f.elements.gtitle.focus();
      document.getElementById('gal-title-cancel').addEventListener('click', () => drawInfo(it));
      f.addEventListener('submit', async (ev) => {
        ev.preventDefault();
        const title = f.elements.gtitle.value.trim();
        f.querySelector('button[type="submit"]').disabled = true;
        const { error: e4 } = await supabase.rpc('set_gallery_title', { p_id: it.id, p_title: title });
        if (e4) { alert(`Could not save the title: ${e4.message}`); f.querySelector('button[type="submit"]').disabled = false; return; }
        it.title = title || null;
        it.title_by = title ? user.player : null;
        drawInfo(it);
        draw();
      });
    });
    function close() {
      view.hidden = true;
      document.getElementById('gal-media').innerHTML = '';
      document.body.style.overflow = '';
      draw();
    }
    document.getElementById('gal-close').addEventListener('click', close);
    document.getElementById('gal-prev').addEventListener('click', () => open(current - 1));
    document.getElementById('gal-next').addEventListener('click', () => open(current + 1));
    view.addEventListener('click', (e) => { if (e.target.classList.contains('gal-stage')) close(); });
    document.addEventListener('keydown', (e) => {
      if (view.hidden || e.target.closest('textarea, input, select')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') open(current - 1);
      if (e.key === 'ArrowRight') open(current + 1);
    });
    document.getElementById('gal-comments').addEventListener('click', async (e) => {
      const id = e.target.closest('[data-del]')?.dataset.del;
      if (!id || !confirm('Are you sure you want to delete this comment?')) return;
      const { error: e2 } = await supabase.from('gallery_comments').delete().eq('id', id);
      if (e2) alert(`Could not delete: ${e2.message}`);
      loadComments(shown[current]);
    });
    // Emotes: click one to put it in the comment where the cursor is.
    const EMOTES = ['😂', '🤣', '😎', '😍', '😮', '😱', '🤔', '😭', '💀', '🔥', '👍', '👏', '💪', '🙌', '❤️', '🍺', '🍗', '⚔️', '🛡️', '🏆', '👑', '💰', '🐉', '🧌', '🐔', '🎉'];
    const ta = document.querySelector('#gal-form textarea');
    document.getElementById('gal-emotes').innerHTML = EMOTES.map((m) => `<button type="button" title="Add ${m}">${m}</button>`).join('');
    document.getElementById('gal-emotes').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      const at = ta.selectionStart ?? ta.value.length;
      ta.setRangeText(b.textContent, at, ta.selectionEnd ?? at, 'end');
      ta.focus();
    });
    document.getElementById('gal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const text = f.body.value.trim();
      if (!text) return;
      f.querySelector('button[type="submit"]').disabled = true;
      const { error: e3 } = await supabase.from('gallery_comments').insert({ item_id: shown[current].id, body: text, player_name: user.player });
      f.querySelector('button[type="submit"]').disabled = false;
      if (e3) { alert(`Could not post: ${e3.message}`); return; }
      f.reset();
      loadComments(shown[current]);
    });
  }
}
</script>
</body>
</html>
