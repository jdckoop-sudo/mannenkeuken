<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raids &amp; Events – Mannenkeuken</title>
<link rel="stylesheet" href="css/style.css?v=__V__">
</head>
<body>
<main>
  <div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
    <div>
      <h1>Raids &amp; Events</h1>
      <p class="muted">Dungeon runs, raids and guild nights – sign up with your role</p>
    </div>
    <button id="toggle-new" class="btn" type="button">Create event</button>
  </div>

  <form id="new" class="box" hidden>
    <h2>New event</h2>
    <p id="form-msg" class="muted"></p>
    <div class="grid">
      <label>Title<input name="title" required maxlength="80" placeholder="e.g. [dungeon name]"></label>
      <label>Date<input name="date" type="date" required></label>
      <fieldset style="flex-direction: column; gap: 6px"><legend style="font-size: 14px; margin-bottom: 6px">Time (24h)</legend>
        <div style="display: flex; gap: 6px; align-items: center">
          <select name="hour" aria-label="Hour"></select><span aria-hidden="true">:</span><select name="minute" aria-label="Minutes"></select>
        </div>
      </fieldset>
      <label>Min. level<input name="min_level" type="number" min="1" max="60"></label>
    </div>
    <div class="grid">
      <label>Tanks needed<input name="tanks_needed" type="number" min="0" value="1"></label>
      <label>Healers needed<input name="healers_needed" type="number" min="0" value="1"></label>
      <label>DPS needed<input name="dps_needed" type="number" min="0" value="3"></label>
    </div>
    <label>Note<textarea name="note" rows="2" maxlength="300"></textarea></label>
    <div><button class="btn btn-primary" type="submit">Create event</button></div>
  </form>

  <section class="box" aria-label="Week">
    <div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center">
      <h2 id="week-title">This week</h2>
      <div style="display: flex; gap: 8px">
        <button class="btn" type="button" id="prev" aria-label="Previous week">‹ Prev</button>
        <button class="btn" type="button" id="today">Today</button>
        <button class="btn" type="button" id="next" aria-label="Next week">Next ›</button>
      </div>
    </div>
    <div style="overflow-x: auto">
      <div id="week" style="display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); gap: 8px; min-width: 800px"></div>
    </div>
  </section>

  <h2>Upcoming</h2>
  <div id="events" style="display: flex; flex-direction: column; gap: 16px"><p class="muted">Loading…</p></div>
</main>
<script type="module">
import { renderHeader } from './js/layout.js?v=__V__';
import { supabase, displayName, isGuildMember, getProfile } from './js/supabase.js?v=__V__';
import { esc } from './js/sheet.js?v=__V__';

const user = await renderHeader();
const canPost = !!(supabase && user && await isGuildMember());
const profile = canPost ? await getProfile(user) : null;
const form = document.getElementById('new');
const toggle = document.getElementById('toggle-new');
const ROLES = ['Tank', 'Healer', 'DPS'];
let events = [];
let signups = [];
let weekStart = startOfWeek(new Date());

toggle.addEventListener('click', () => {
  if (!canPost) { alertMsg(); return; }
  form.hidden = !form.hidden;
});
function alertMsg() {
  const m = !supabase ? 'Not connected yet.' : !user ? 'Log in with Discord to create events.' : 'Only members of the Mannenkeuken Discord can create events.';
  document.getElementById('events').insertAdjacentHTML('afterbegin', `<p class="notice">${m}</p>`);
}

function startOfWeek(d) {
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); // Monday
  return x;
}
const fmtDay = (d) => d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const fmtTime = (d) => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
const fmtFull = (d) => `${d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })} · ${fmtTime(d)}`;

async function load() {
  if (!supabase) { document.getElementById('events').innerHTML = '<p class="muted">Not connected yet.</p>'; drawWeek(); return; }
  const since = new Date(Math.min(weekStart.getTime(), Date.now() - 6 * 3600e3)).toISOString();
  const [{ data: ev }, { data: su }] = await Promise.all([
    supabase.from('events').select('*').gte('starts_at', since).order('starts_at'),
    supabase.from('signups').select('*'),
  ]);
  events = ev ?? [];
  signups = su ?? [];
  drawWeek();
  drawEvents();
}

function drawWeek() {
  const end = new Date(weekStart); end.setDate(end.getDate() + 7);
  const last = new Date(end); last.setDate(last.getDate() - 1);
  document.getElementById('week-title').textContent = `${fmtDay(weekStart)} – ${fmtDay(last)}`;
  const todayKey = new Date().toDateString();
  let html = '';
  for (let i = 0; i < 7; i++) {
    const day = new Date(weekStart); day.setDate(day.getDate() + i);
    const items = events.filter((e) => new Date(e.starts_at).toDateString() === day.toDateString());
    html += `<div style="border:${day.toDateString() === todayKey ? '2px solid #1f2937' : '1px solid #d1d5db'};border-radius:6px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px">
      <strong style="font-size:14px">${fmtDay(day)}</strong>
      ${items.map((e) => `<a href="#ev-${e.id}" style="background:#e5e7eb;border-radius:4px;padding:6px;font-size:13px;text-decoration:none">${esc(e.title)} · ${fmtTime(new Date(e.starts_at))}</a>`).join('')}
    </div>`;
  }
  document.getElementById('week').innerHTML = html;
}

function drawEvents() {
  const upcoming = events.filter((e) => new Date(e.starts_at).getTime() > Date.now() - 6 * 3600e3);
  document.getElementById('events').innerHTML = upcoming.map((e) => {
    const s = signups.filter((x) => x.event_id === e.id);
    const mine = s.find((x) => x.user_id === user?.id);
    const need = { Tank: e.tanks_needed, Healer: e.healers_needed, DPS: e.dps_needed };
    const cols = ROLES.map((r) => {
      const yes = s.filter((x) => x.role === r && x.answer === 'yes');
      const maybe = s.filter((x) => x.role === r && x.answer === 'maybe');
      const open = Math.max(0, (need[r] ?? 0) - yes.length);
      return `<div style="border:1px solid #d1d5db;border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:8px">
        <div style="display:flex;justify-content:space-between"><strong>${r}</strong><span class="muted">${yes.length} / ${need[r] ?? 0}</span></div>
        ${yes.map((x) => `<span>${esc(x.author_name)}</span>`).join('')}
        ${maybe.map((x) => `<span class="muted">${esc(x.author_name)} (maybe)</span>`).join('')}
        ${open ? `<span class="muted">${open} open slot${open > 1 ? 's' : ''}</span>` : ''}
      </div>`;
    }).join('');
    const no = s.filter((x) => x.answer === 'no');
    const signupForm = canPost ? `
      <form data-signup="${e.id}" style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end">
        <label>Your role<select name="role">${ROLES.map((r) => `<option ${(mine?.role ?? profile?.role) === r ? 'selected' : ''}>${r}</option>`).join('')}</select></label>
        <button class="btn ${mine?.answer === 'yes' ? 'btn-primary' : ''}" type="submit" value="yes">Sign up</button>
        <button class="btn ${mine?.answer === 'maybe' ? 'btn-primary' : ''}" type="submit" value="maybe">Maybe</button>
        <button class="btn ${mine?.answer === 'no' ? 'btn-primary' : ''}" type="submit" value="no">Can't come</button>
      </form>` : '<p class="muted">Log in with Discord to sign up.</p>';
    return `<section class="box" id="ev-${e.id}">
      <div style="display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start">
        <div style="display:flex;flex-direction:column;gap:6px">
          <h2 style="font-size:24px">${esc(e.title)}</h2>
          <span class="muted">${fmtFull(new Date(e.starts_at))}${e.min_level ? ` · Min. level ${esc(e.min_level)}` : ''} · Organised by ${esc(e.author_name)}</span>
          ${e.note ? `<span>${esc(e.note)}</span>` : ''}
        </div>
        ${e.user_id === user?.id ? `<button class="link-btn" type="button" data-del="${e.id}" data-name="${esc(e.title)}">Cancel event</button>` : ''}
      </div>
      ${signupForm}
      <div class="grid">${cols}</div>
      ${no.length ? `<p class="muted">Can't come: ${no.map((x) => esc(x.author_name)).join(', ')}</p>` : ''}
    </section>`;
  }).join('') || '<p class="muted">No upcoming events. Create one!</p>';
}

document.getElementById('prev').addEventListener('click', () => { weekStart.setDate(weekStart.getDate() - 7); load(); });
document.getElementById('next').addEventListener('click', () => { weekStart.setDate(weekStart.getDate() + 7); load(); });
document.getElementById('today').addEventListener('click', () => { weekStart = startOfWeek(new Date()); load(); });

document.getElementById('events').addEventListener('submit', async (ev) => {
  const f = ev.target.closest('form[data-signup]');
  if (!f) return;
  ev.preventDefault();
  const answer = ev.submitter?.value ?? 'yes';
  const { error } = await supabase.from('signups').upsert({
    event_id: f.dataset.signup, user_id: user.id, author_name: profile?.character_name || displayName(user),
    role: new FormData(f).get('role'), answer,
  }, { onConflict: 'event_id,user_id' });
  if (error) f.insertAdjacentHTML('beforeend', `<span class="muted">Could not save: ${esc(error.message)}</span>`);
  load();
});

document.getElementById('events').addEventListener('click', async (ev) => {
  const id = ev.target.dataset?.del;
  if (!id) return;
  if (!confirm(`Are you sure you want to cancel "${ev.target.dataset.name}"? All sign-ups will be removed.`)) return;
  await supabase.from('events').delete().eq('id', id);
  load();
});

// 24-hour time pickers (the browser's own picker shows AM/PM in some languages)
const pad = (x) => String(x).padStart(2, '0');
form.hour.innerHTML = Array.from({ length: 24 }, (_, h) => `<option>${pad(h)}</option>`).join('');
form.minute.innerHTML = ['00', '15', '30', '45'].map((m) => `<option>${m}</option>`).join('');
function fillTime() { form.hour.value = '19'; form.minute.value = '00'; }
fillTime();
function startsAt(d) {
  const [y, mo, day] = d.get('date').split('-').map(Number);
  return new Date(y, mo - 1, day, Number(d.get('hour')), Number(d.get('minute')));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const d = new FormData(form);
  const num = (k) => (d.get(k) === '' ? null : Number(d.get(k)));
  const { error } = await supabase.from('events').insert({
    title: d.get('title'), starts_at: startsAt(d).toISOString(),
    min_level: num('min_level'), tanks_needed: num('tanks_needed') ?? 0,
    healers_needed: num('healers_needed') ?? 0, dps_needed: num('dps_needed') ?? 0,
    note: d.get('note'), author_name: displayName(user),
  });
  document.getElementById('form-msg').textContent = error ? `Could not create: ${error.message}` : 'Event created!';
  if (!error) { form.reset(); fillTime(); form.hidden = true; weekStart = startOfWeek(startsAt(d)); load(); }
});

load();
</script>
</body>
</html>
