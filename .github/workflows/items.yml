# Daily: fetch the newest WoW: Forever item list and commit it if it changed.
name: Update items
on:
  schedule:
    - cron: '17 5 * * *'   # daily 05:17 UTC (only commits when there is a new client build)
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the build did not change'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download item list
        run: node tools/update-items.mjs
        env:
          FORCE: ${{ inputs.force && '1' || '' }}
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/items.json data/tradeable-items.json && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/items.json data/tradeable-items.json
          git commit -m "Update WoW: Forever item list"
          git push
