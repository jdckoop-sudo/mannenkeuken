# Fetch level, professions and last login of all guild characters from the Blizzard API into data/blizzard-characters.json.
# Needs the repository secrets BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET. Settings: data/blizzard-config.json.
# Manual only, as a reserve: the data normally comes every 15 minutes from the Supabase Edge Function (supabase/functions/update-characters, see
# docs/instructies.md). This workflow writes the old file, which the site only uses while the database tables are empty. Tick "Dry run" to only print.
# When the data file changed it is committed to main and the site is published again. (A commit made with the workflow token does not start the
# deploy by itself, so the last step starts it.)
name: Update characters
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: only print what would be stored (writes and commits nothing)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write   # to start the deploy after a commit
concurrency: update-characters
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch the characters
        run: node tools/update-characters.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/blizzard-characters.json && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No changes"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blizzard-characters.json
          git commit -m "Update characters from the Blizzard API"
          git push
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main   # publish the new data
