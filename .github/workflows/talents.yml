# Daily: rebuild the shape of the WoW: Forever talent trees (Blizzard game data) and commit data/talents.json if it changed.
# Needs the repository secrets BLIZZARD_CLIENT_ID and BLIZZARD_CLIENT_SECRET. Which talents a character chose is not in here:
# that comes every 5 minutes from the Edge Function update-characters.
name: Update talents
on:
  schedule:
    - cron: '47 5 * * *'   # daily 05:47 UTC (only commits when the trees changed)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build talent trees
        run: node tools/update-talents.mjs
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
      - name: Commit if changed
        run: |
          node -e "const a=require('./data/talents.json');delete a.updated;require('fs').writeFileSync('/tmp/new.json',JSON.stringify(a))"
          git show HEAD:data/talents.json > /tmp/old-full.json 2>/dev/null || echo '{}' > /tmp/old-full.json
          node -e "const a=require('/tmp/old-full.json');delete a.updated;require('fs').writeFileSync('/tmp/old.json',JSON.stringify(a))"
          if cmp -s /tmp/new.json /tmp/old.json; then echo "No changes"; git checkout -- data/talents.json 2>/dev/null || true; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/talents.json
          git commit -m "Update WoW: Forever talent trees"
          git push
