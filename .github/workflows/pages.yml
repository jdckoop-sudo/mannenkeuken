# Publishes the site to GitHub Pages on every push to main.
# Stamps a version (?v=__V__ → commit id) on CSS/JS (and on images referenced from CSS) so browsers never mix old and new files.
name: Deploy site
on:
  push:
    branches: [main]
  workflow_run:   # a commit made by "Update items" does not trigger push, so deploy after it
    workflows: ["Update items"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp version
        run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/__V__/$V/g" *.html js/*.js css/*.css
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
