# Publishes the site to GitHub Pages on every push to main.
# Stamps a version (?v=__V__ → commit id) on CSS/JS (and on images referenced from CSS) so browsers never mix old and new files.
# Preview: the newest open pull request with the label "preview" is published as well, at /preview/ (see preview.yml and go-live.yml).
name: Deploy site
on:
  push:
    branches: [main]
  workflow_run:   # a commit made by a workflow does not trigger push, so deploy after the data workflows (items, quests, talents, recipes)
    workflows: ["Update items", "Update quests", "Update talents", "Update recipes"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add preview of the newest open pull request labelled "preview"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label preview --json headRefName,updatedAt --jq 'sort_by(.updatedAt) | last | .headRefName // ""')
          if [ -n "$BRANCH" ]; then
            echo "Preview: $BRANCH"
            git fetch origin "$BRANCH"
            mkdir preview
            git archive "origin/$BRANCH" | tar -x -C preview
            rm -rf preview/.github preview/tools preview/supabase preview/docs
            PV=$(git rev-parse --short=8 "origin/$BRANCH")
            sed -i "s/__V__/p$PV/g" preview/*.html preview/js/*.js preview/css/*.css
            echo "{\"version\":\"p$PV\"}" > preview/version.json
          else
            echo "No open preview"
          fi
      - name: Stamp version
        run: |
          V="$(git rev-parse --short=8 HEAD)"
          sed -i "s/__V__/$V/g" *.html js/*.js css/*.css
          echo "{\"version\":\"$V\"}" > version.json   # pages compare this with their own version (new-version bar, js/layout.js)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # GitHub Pages refuses a deployment while the previous one is still finishing ("in progress deployment", seen 10 Nov 2026 when a merge
      # came two minutes after the deploy that follows "Update items"). So: try, and when that fails wait a minute and try once more.
      # When the second try fails too, the job fails as before (and "Check site after deploy" does not run).
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
